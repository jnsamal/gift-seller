# Local development only. Bind database ports to loopback.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gifty_dev
      MYSQL_USER: gifty
      MYSQL_PASSWORD: ${MYSQL_DEV_PASSWORD:?Set MYSQL_DEV_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:?Set MYSQL_DEV_ROOT_PASSWORD}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["gifty_mysql_dev:/var/lib/mysql"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -h127.0.0.1 -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: gifty_test
      MYSQL_USER: gifty
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Set MYSQL_TEST_ROOT_PASSWORD}
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["gifty_mysql_test:/var/lib/mysql"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -h127.0.0.1 -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  gifty_mysql_dev:
  gifty_mysql_test:
